name: Build and test

# Every push and pull request is built and tested on macOS with full
# Xcode: the app can't be built anywhere else (SwiftUI's macro plugins
# aren't in the standalone Command Line Tools), so this is the only place
# changes made off a Mac get compiled.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The Xcode 27 image (a preview, on macOS 27): the macos-26 image has
    # only Xcode 26, whose Swift rejected code Xcode 27 builds, and
    # crashed on some. The viewer also needs the macOS 26 SDK or later.
    runs-on: xcode-27
    timeout-minutes: 30
    # The Xcode the app is developed with, rather than the image's
    # default (27.1). The image's 27.2 is its release candidate.
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Check for the pinned Xcode
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::$DEVELOPER_DIR isn't on this runner. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      # Only for main: the release build compiles the whole app in one
      # optimized step, about four minutes, which branches can do without.
      - name: Build the app bundle
        if: github.ref == 'refs/heads/main'
        run: |
          scripts/build-app.sh build
          # Zipped with ditto: the artifact upload drops the executable bit.
          ditto -c -k --keepParent build/AnimationMeetsVideo.app build/AnimationMeetsVideo.zip
      - name: Upload the app bundle
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: AnimationMeetsVideo-app
          path: build/AnimationMeetsVideo.zip
          retention-days: 14
